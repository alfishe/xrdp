[codec]
order = [ "H.264", "RFX" ]

# Specify a preferred H.264 encoder: "x264", "OpenH264" or "NVENC".
# "NVENC" uses the GPU hardware encoder of NVIDIA cards and needs a
# build with --enable-nvenc. If NVENC cannot be used at run time, xrdp
# falls back to a software encoder that was enabled at compile time.
# For x264 and OpenH264 this parameter takes effect only when both are
# enabled at compile time. If only one is enabled, it is used regardless
# of this parameter.
h264_encoder = "x264"

#
# Configurations for x264
#
[x264.default]
# NOTE: x264 specifies bitrate in unit of kbps.
preset = "ultrafast"
tune = "zerolatency"
profile = "main"     # profile is forced to baseline if preset == ultrafast
vbv_max_bitrate = 0
vbv_buffer_size = 0
fps_num = 60
fps_den = 1
threads = 1          # recommended: 1 or 2, see `man gfx.toml` for details

[x264.lan]
# inherits default

[x264.wan]
vbv_max_bitrate = 15_000
vbv_buffer_size = 1_500

[x264.broadband_high]
preset = "superfast"
vbv_max_bitrate = 8_000
vbv_buffer_Size = 800

[x264.satellite]
preset = "superfast"
vbv_max_bitrate = 5_000
vbv_buffer_size = 500

[x264.broadband_low]
preset = "veryfast"
vbv_max_bitrate = 1_600
vbv_buffer_size = 66

[x264.modem]
preset = "fast"
vbv_max_bitrate = 1_200
vbv_buffer_size = 50

#
# Configurations for OpenH264
#
[OpenH264.default]
# NOTE: OpenH264 specifies bitrate in unit of bps, not kbps.
EnableFrameSkip = false
TargetBitrate = 20_000_000
MaxBitrate =    0          # unspecified
MaxFrameRate = 60.0

[OpenH264.lan]
# inherits default

[OpenH264.wan]
TargetBitrate = 10_000_000
MaxBitrate =    12_000_000

[OpenH264.broadband_high]
EnableFrameSkip = true
TargetBitrate = 8_000_000
MaxBitrate =   10_000_000

[OpenH264.satellite]
EnableFrameSkip = true
TargetBitrate = 4_000_000
MaxBitrate =    6_000_000

[OpenH264.broadband_low]
EnableFrameSkip = true
TargetBitrate = 1_600_000
MaxBitrate =    1_800_000

[OpenH264.modem]
EnableFrameSkip = true
TargetBitrate =   600_000
MaxBitrate =    1_200_000

#
# Configurations for NVENC
#
# The NVENC encoder only codes the frames it is given, at a constant QP.
# It knows nothing about frame rate or bandwidth: when frames are taken is
# decided before the encoder (capture interval, client frame acks).
#
# Preset is "p1" (fastest) .. "p7" (best quality).
# Qp is the constant quantizer, 1 (best) .. 51 (worst); 0 = default (23).
#
[NVENC.default]
Preset = "p2"
Qp = 23
[NVENC.lan]
[NVENC.wan]
Qp = 28
[NVENC.broadband_high]
Qp = 30
[NVENC.satellite]
Qp = 32
[NVENC.broadband_low]
Qp = 34
[NVENC.modem]
Qp = 38
